name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Generates the Android folder if it isn't committed yet (skips existing files).
      - run: flutter create --org com.castledangermusic --project-name cd_tuner_app --platforms android .
      - name: App icons
        run: cp -R tool/android/res/. android/app/src/main/res/
      - name: Minimum Android 6.0 for the audio engine
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && perl -pi -e 's/minSdk(Version)?\s*=?\s*flutter\.minSdkVersion/minSdk = 23/' "$f" || true
          done
      - name: Bundle fonts
        run: bash tool/fetch_fonts.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cd-tuner-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Generates the iOS folder and adds microphone + background audio settings.
      - run: bash tool/setup_platforms.sh
      # Compile check only; signing for TestFlight comes later.
      - run: flutter build ios --release --no-codesign
