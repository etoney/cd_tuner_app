name: cd_tuner_app
description: Castle Danger Music Company tuner and metronome for guitar and bass.
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  cdmc_audio:
    path: packages/cdmc_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
